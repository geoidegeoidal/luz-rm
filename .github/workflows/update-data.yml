name: update-data

on:
  schedule:
    # Respaldo best-effort; cron-job.org activa workflow_dispatch cada 5 min.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    # El token externo solo debe activar el espejo publico de main.
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Una ejecucion encolada debe leer el ultimo snapshot confirmado.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos de Enel (espejo)
        run: node scripts/fetch-data.mjs

      - name: Commit si hay cambios
        id: commit
        run: |
          git config user.name "luz-rm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "sin cambios"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
